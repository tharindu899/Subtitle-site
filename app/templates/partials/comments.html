<section class="discussion" data-comments data-comments-url="/api/public/titles/{{ title.id }}/comments">
  <div class="section__head">
    <div><span>Community</span><h2>Discussion</h2></div>
    <p>Share a useful comment about the subtitle release.</p>
  </div>
  <form class="comment-form" data-comment-form data-post-url="/api/public/titles/{{ title.id }}/comments">
    <div class="comment-form__fields">
      <input name="name" maxlength="42" placeholder="Name (optional)">
      <textarea class="sinhala-input" name="text" maxlength="800" required placeholder="Write a comment" lang="si"></textarea>
    </div>
    <footer><small data-comment-status></small><button type="submit">Post comment</button></footer>
  </form>
  <div class="comment-list" data-comment-list>
    {% for comment in comments %}
      <article class="comment-card">
        <header><b>{{ comment.name }}</b><span>{{ comment.createdAt or '' }}</span></header>
        <p class="sinhala-copy" lang="si">{{ comment.body }}</p>
        <button type="button" data-comment-like-url="/api/public/comments/{{ comment.id }}/reaction"><i class="fa-solid fa-heart"></i> Like <span>{{ comment.likes }}</span></button>
      </article>
    {% else %}
      <p class="comment-empty">No comments yet. Be the first to add one.</p>
    {% endfor %}
  </div>
</section>
