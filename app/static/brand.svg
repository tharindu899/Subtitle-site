<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CineLanka — Sinhala Subtitle Archive">
  <defs>
    <radialGradient id="bgGlow" cx="38%" cy="34%" r="75%">
      <stop offset="0" stop-color="#241d15"/>
      <stop offset=".55" stop-color="#120f0b"/>
      <stop offset="1" stop-color="#050403"/>
    </radialGradient>

    <linearGradient id="panelStroke" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4a3d26"/>
      <stop offset="1" stop-color="#221a12"/>
    </linearGradient>

    <linearGradient id="reelOuter" x1="120" y1="100" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe0a3"/>
      <stop offset=".45" stop-color="#ffc25c"/>
      <stop offset="1" stop-color="#c9791f"/>
    </linearGradient>
    <linearGradient id="reelInner" x1="150" y1="130" x2="362" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd88a"/>
      <stop offset="1" stop-color="#d4841f"/>
    </linearGradient>
    <radialGradient id="hubShine" cx="42%" cy="36%" r="65%">
      <stop offset="0" stop-color="#fff2d6"/>
      <stop offset=".5" stop-color="#ffc25c"/>
      <stop offset="1" stop-color="#c9791f"/>
    </radialGradient>

    <linearGradient id="badgeRing" x1="324" y1="322" x2="436" y2="436" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff8377"/>
      <stop offset=".5" stop-color="#e0584c"/>
      <stop offset="1" stop-color="#6e231e"/>
    </linearGradient>
    <radialGradient id="badgeFace" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#1c1712"/>
      <stop offset="1" stop-color="#0a0806"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feFlood flood-color="#eda23c" flood-opacity=".55" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="48" fill="url(#bgGlow)"/>
  <rect x="12" y="12" width="488" height="488" rx="38" fill="none" stroke="url(#panelStroke)" stroke-width="2.5"/>
  <rect x="24" y="24" width="464" height="464" rx="30" fill="none" stroke="rgba(242,236,221,.06)" stroke-width="1"/>

  <g fill="#3a3122">
    <rect x="44" y="66" width="18" height="12" rx="3"/>
    <rect x="44" y="120" width="18" height="12" rx="3"/>
    <rect x="44" y="370" width="18" height="12" rx="3"/>
    <rect x="44" y="424" width="18" height="12" rx="3"/>
    <rect x="450" y="66" width="18" height="12" rx="3"/>
    <rect x="450" y="120" width="18" height="12" rx="3"/>
    <rect x="450" y="370" width="18" height="12" rx="3"/>
    <rect x="450" y="424" width="18" height="12" rx="3"/>
  </g>

  <g opacity=".18" stroke="#f2ecdd" stroke-width="3" fill="none">
    <path d="M 96 300 A 210 210 0 0 1 300 96"/>
  </g>

  <g filter="url(#dropShadow)">
    <g filter="url(#softGlow)">
      <circle cx="256" cy="246" r="140" fill="none" stroke="url(#reelOuter)" stroke-width="20"/>
      <circle cx="256" cy="246" r="140" fill="none" stroke="#fff2d6" stroke-width="2" opacity=".35"/>
      <circle cx="256" cy="246" r="118" fill="none" stroke="url(#reelInner)" stroke-width="3" opacity=".5"/>

      <g stroke="url(#reelInner)" stroke-width="7" opacity=".85">
        <line x1="256" y1="246" x2="256" y2="146"/>
        <line x1="256" y1="246" x2="171" y2="196"/>
        <line x1="256" y1="246" x2="341" y2="196"/>
        <line x1="256" y1="246" x2="185" y2="316"/>
        <line x1="256" y1="246" x2="327" y2="316"/>
      </g>

      <circle cx="256" cy="150" r="27" fill="none" stroke="url(#reelInner)" stroke-width="15"/>
      <circle cx="176" cy="286" r="27" fill="none" stroke="url(#reelInner)" stroke-width="15"/>
      <circle cx="336" cy="286" r="27" fill="none" stroke="url(#reelInner)" stroke-width="15"/>

      <circle cx="256" cy="246" r="34" fill="url(#hubShine)"/>
      <circle cx="256" cy="246" r="34" fill="none" stroke="#7a4d18" stroke-width="2" opacity=".4"/>
      <ellipse cx="245" cy="234" rx="12" ry="7" fill="#fff8ea" opacity=".55"/>
    </g>
  </g>

  <g filter="url(#dropShadow)">
    <circle cx="380" cy="380" r="60" fill="url(#badgeFace)" stroke="url(#badgeRing)" stroke-width="7"/>
    <circle cx="380" cy="380" r="60" fill="none" stroke="#0c0b09" stroke-width="2" stroke-dasharray="2 7" opacity=".8"/>
    <ellipse cx="362" cy="358" rx="20" ry="10" fill="#ffffff" opacity=".08"/>
    <text x="380" y="401" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#f8f2e2">සි</text>
  </g>
</svg>
