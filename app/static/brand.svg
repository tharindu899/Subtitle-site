<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Sinhala Subtitle Archive">
  <defs>
    <linearGradient id="panel" x1="60" y1="40" x2="452" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a231a"/>
      <stop offset="1" stop-color="#0c0b09"/>
    </linearGradient>
    <linearGradient id="reel" x1="150" y1="130" x2="390" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffc25c"/>
      <stop offset="1" stop-color="#eda23c"/>
    </linearGradient>
    <linearGradient id="badge" x1="324" y1="324" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0584c"/>
      <stop offset="1" stop-color="#c1443a"/>
    </linearGradient>
    <filter id="amberGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#eda23c" flood-opacity=".5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="40" fill="#050403"/>
  <rect x="14" y="14" width="484" height="484" rx="28" fill="url(#panel)"/>
  <rect x="14" y="14" width="484" height="484" rx="28" fill="none" stroke="#3a3122" stroke-width="2"/>

  <g fill="#3a3122">
    <rect x="40" y="60" width="20" height="14" rx="4"/>
    <rect x="40" y="118" width="20" height="14" rx="4"/>
    <rect x="40" y="366" width="20" height="14" rx="4"/>
    <rect x="40" y="424" width="20" height="14" rx="4"/>
    <rect x="452" y="60" width="20" height="14" rx="4"/>
    <rect x="452" y="118" width="20" height="14" rx="4"/>
    <rect x="452" y="366" width="20" height="14" rx="4"/>
    <rect x="452" y="424" width="20" height="14" rx="4"/>
  </g>

  <g filter="url(#amberGlow)">
    <circle cx="256" cy="246" r="134" fill="none" stroke="url(#reel)" stroke-width="16"/>
    <circle cx="256" cy="246" r="30" fill="url(#reel)"/>
    <circle cx="256" cy="150" r="26" fill="none" stroke="url(#reel)" stroke-width="14"/>
    <circle cx="176" cy="286" r="26" fill="none" stroke="url(#reel)" stroke-width="14"/>
    <circle cx="336" cy="286" r="26" fill="none" stroke="url(#reel)" stroke-width="14"/>
  </g>

  <g>
    <circle cx="378" cy="378" r="56" fill="#0c0b09" stroke="url(#badge)" stroke-width="6"/>
    <circle cx="378" cy="378" r="56" fill="none" stroke="#0c0b09" stroke-width="2" stroke-dasharray="2 6"/>
    <text x="378" y="399" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#f2ecdd">සි</text>
  </g>

  <circle cx="112" cy="112" r="6" fill="#eda23c"/>
</svg>
